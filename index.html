  .bar { display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-weight:bold; font-size:11px; text-shadow:0 1px 0 #fff; }

  </div>

</div>

<script>
let emu,fw={w:null,b:null,v:null},media={fda:null,fdb:null,cd:null},hddFile=null,hddBuf=null;
const openDB=()=>new Promise((res,rej)=>{let r=indexedDB.open("ChronosFW_DB",1);r.onupgradeneeded=()=>r.result.createObjectStore("fw");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
(async()=>{try{let db=await openDB(),tx=db.transaction("fw","readonly").objectStore("fw");for(let k of["w","b","v"]){let val=await new Promise(r=>{let g=tx.get(k);g.onsuccess=()=>r(g.result);g.onerror=()=>r(null)});if(val){fw[k]=val;document.getElementById("l"+k).classList.add("ok")}}st.textContent=(fw.w&&fw.b&&fw.v)?"All firmware restored from IndexedDB! Click Run.":"Upload firmware once (saves to IndexedDB)."}catch(e){st.textContent="IndexedDB unavailable; upload firmware."}})();
["w","b","v"].forEach(k=>document.getElementById(k).onchange=async e=>{let f=e.target.files.item(0);if(!f)return;fw[k]=await f.arrayBuffer();document.getElementById("l"+k).classList.add("ok");try{let db=await openDB();await new Promise((res,rej)=>{let tx=db.transaction("fw","readwrite");tx.objectStore("fw").put(fw[k],k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});st.textContent="Firmware saved to IndexedDB!"}catch(err){}});
async function insert(t,f){
  if(!f)return;
  if(t==="fda"){let buf=await f.arrayBuffer();media.fda=buf;lblA.textContent="A: "+f.name;ledA.classList.add("on");slitA.innerHTML='<div class="floppy-media"></div>';emu&&emu.set_fda({buffer:buf})}
  if(t==="fdb"){let buf=await f.arrayBuffer();media.fdb=buf;lblB.textContent="B: "+f.name;ledB.classList.add("on");slitB.innerHTML='<div class="floppy-media"></div>';emu&&emu.set_fdb({buffer:buf})}
  if(t==="cd"){media.cd=f;lblC.textContent="CD/DVD: "+f.name;ledC.classList.add("on");trayC.innerHTML='<div class="cd-media"></div>';emu&&emu.set_cdrom({buffer:f,async:true})}
}
function eject(t){
  media[t]=null;
  if(t==="fda"){fdaIn.value="";lblA.textContent="A: [Empty]";ledA.classList.remove("on");slitA.innerHTML="";emu&&emu.eject_fda()}
  if(t==="fdb"){fdbIn.value="";lblB.textContent="B: [Empty]";ledB.classList.remove("on");slitB.innerHTML="";emu&&emu.eject_fdb()}
  if(t==="cd"){cdIn.value="";lblC.textContent="CD/DVD: [Empty]";ledC.classList.remove("on");trayC.innerHTML="";emu&&emu.eject_cdrom()}
}
async function boot(){
  if(!fw.w||!fw.b||!fw.v)return alert("Upload firmware first.");
  if(emu)await emu.destroy();
  let mb=+hdd.value;
  hddBuf=hddFile?await hddFile.arrayBuffer():(mb?new ArrayBuffer(Math.min(mb*1048576,2147483136)):null);
  let cfg={
    wasm_fn:async i=>(await WebAssembly.instantiate(fw.w.slice(0),i)).instance.exports,
    memory_size:+ram.value*1048576,
    vga_memory_size:8388608,
    screen_container:screen_container,
    screen:{use_graphical_text:true},
    bios:{buffer:fw.b.slice(0)},
    vga_bios:{buffer:fw.v.slice(0)},
    sb16:true,
    network_relay_url:"wss://relay.widgetry.org/",
    bootmenu:true,
    autostart:true
  };
  if(media.fda)cfg.fda={buffer:media.fda};
  if(media.fdb)cfg.fdb={buffer:media.fdb};
  if(media.cd)cfg.cdrom={buffer:media.cd,async:true};
  if(hddBuf)cfg.hda={buffer:hddBuf,async:hddBuf.byteLength>=536870912};
  emu = new V86(cfg);
  st.textContent="Running with SB16 & Network Relay.";
}
